<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Chatbot: สลับ session (มือถือ)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
button{font-family:inherit}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; display: flex; flex-direction: column; background: #F4F5F2; color: #17211D; font-family: 'IBM Plex Sans Thai', 'Noto Sans Thai', system-ui, sans-serif; font-size: 14px; line-height: 1.5">

  <header style="display: flex; align-items: center; gap: 4px; padding: 10px 8px 10px 6px; background: #FFFFFF; border-bottom: 1px solid #E2E5E0">
    <button aria-label="เปิดเมนู" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: transparent; color: #17211D; border-radius: 12px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h10M4 17h16"/></svg></button>
    <button onClick="{{toggle}}" aria-expanded="{{openAttr}}" style="flex-grow: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; gap: 8px; border: 0; background: transparent; color: #17211D; text-align: left; padding: 0 8px; border-radius: 12px">
      <span style="display: flex; flex-direction: column; min-width: 0; line-height: 1.25">
        <span style="font-size: 15px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">เก้าอี้ทำงาน งบ 3,000</span>
        <span style="font-size: 12px; color: #56625C">ออเดอร์ · กำลังจัดส่ง</span>
      </span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; transition: transform .2s; transform: rotate({{rot}}deg)"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <button aria-label="แชทใหม่" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border: 0; background: #1E6F50; color: #FFFFFF; border-radius: 12px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </header>

  <a href="OrderTracking.dc.html" style="display: flex; align-items: center; gap: 10px; margin: 10px 12px 0; padding: 8px 12px; background: #FFFFFF; border: 1px solid #E2E5E0; border-radius: 12px; text-decoration: none; color: inherit">
    <span style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1; line-height: 1.3">
      <span style="font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">เก้าอี้ทำงาน Ergonomic รุ่น Flex Pro สีดำ</span>
      <span style="font-size: 11.5px; color: #56625C">฿2,812.95 · กำลังจัดส่ง</span>
    </span>
    <span style="font-size: 12.5px; font-weight: 600; color: #1E6F50">ดู</span>
  </a>

  <main style="flex-grow: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <div style="align-self: flex-end; max-width: 82%; background: #17211D; color: #FFFFFF; padding: 10px 14px; border-radius: 18px 18px 4px 18px">หาเก้าอี้ทำงาน งบ 3,000</div>
    <div style="align-self: flex-start; max-width: 88%; background: #FFFFFF; border: 1px solid #E2E5E0; padding: 10px 14px; border-radius: 18px 18px 18px 4px">เจอเก้าอี้ ergonomic 3 ตัวครับ ตัวแรกรีวิวดีที่สุด</div>
  </main>

  <form style="display: flex; align-items: center; gap: 8px; padding: 10px 12px 16px; background: #FFFFFF; border-top: 1px solid #E2E5E0">
    <span style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border: 1px solid #C9D1CC; border-radius: 50%"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
    <span style="flex-grow: 1; height: 44px; display: flex; align-items: center; padding: 0 16px; border: 1px solid #C9D1CC; border-radius: 999px; background: #F7F8F6; color: #8A948E">พิมพ์ต่อในแชทนี้</span>
    <span style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: #1E6F50; color: #FFFFFF; border-radius: 50%"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2-7z"/></svg></span>
  </form>

  <sc-if value="{{open}}" hint-placeholder-val="{{true}}">
    <div style="position: absolute; inset: 0; z-index: 10">
      <button onClick="{{toggle}}" aria-label="ปิดรายการแชท" style="position: absolute; inset: 0; width: 100%; border: 0; background: rgba(23, 33, 29, 0.4)"></button>
      <div role="dialog" aria-label="เลือกแชท" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 80%; display: flex; flex-direction: column; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.18)">
        <div style="align-self: center; width: 40px; height: 4px; margin: 10px 0 4px; border-radius: 4px; background: #DDE2DE"></div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 6px 18px 10px">
          <h2 style="margin: 0; font-size: 17px; font-weight: 700">การสนทนา</h2>
          <button style="height: 40px; padding: 0 14px; display: flex; align-items: center; gap: 6px; border: 0; background: #1E6F50; color: #FFFFFF; border-radius: 10px; font-size: 14px; font-weight: 600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>แชทใหม่</button>
        </div>
        <div style="overflow: hidden; padding: 0 10px 18px; display: flex; flex-direction: column; gap: 2px">
          <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
            <div style="{{r.style}}">
              <sc-if value="{{r.hasThumb}}" hint-placeholder-val="{{false}}">
                <span aria-hidden="true" style="{{r.thumbStyle}}">{{r.thumbMark}}</span>
              </sc-if>
              <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0; flex-grow: 1">
                <span style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
                  <span style="font-size: 14.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.title}}</span>
                  <span style="flex-shrink: 0; font-size: 11.5px; color: #6B756F">{{r.time}}</span>
                </span>
                <span style="font-size: 12.5px; color: #56625C; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.snippet}}</span>
                <sc-if value="{{r.hasOrder}}" hint-placeholder-val="{{false}}">
                  <span style="{{r.chipStyle}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: currentColor"></span>{{r.orderLabel}}</span>
                </sc-if>
              </span>
            </div>
          </sc-for>
        </div>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true };
  }
  renderVals() {
    const items = [
      { title: 'เก้าอี้ทำงาน งบ 3,000', time: '01:28', snippet: 'เจอเก้าอี้ ergonomic 3 ตัวครับ', order: 'ออเดอร์ · กำลังจัดส่ง', tone: 'background: #E3F1EA; color: #14513A', on: true, pick: { mark: 'เก้าอี้', bg: '#E7D7B8', fg: '#4A3510' } },
      { title: 'หูฟังประชุม ส่งพรุ่งนี้', time: '00:40', snippet: 'สร้างออเดอร์แล้ว รอการชำระเงิน', order: 'ออเดอร์ · รอชำระเงิน', tone: 'background: #FFF1D6; color: #6B4A00', on: false, pick: { mark: 'หูฟัง', bg: '#1F2A26', fg: '#E9EEEA' } },
      { title: 'โคมไฟอ่านหนังสือ', time: '00:12', snippet: 'เอาตัวแรกครับ เปิดหน้าสรุปยอดให้แล้ว', order: 'เลือกสินค้าแล้ว · ยังไม่ได้สั่งซื้อ', tone: 'background: #EAF0F8; color: #24365A', on: false, pick: { mark: 'โคมไฟ', bg: '#F3D9D2', fg: '#7A2E1E' } },
      { title: 'iPad Pro งบ 5,000', time: 'เมื่อวาน', snippet: 'ในงบนี้ไม่มี iPad Pro มือหนึ่ง', order: '', tone: '', on: false, pick: null },
      { title: 'ของขวัญวันเกิดแม่', time: 'เมื่อวาน', snippet: 'ได้รับสินค้าแล้ว ขอบคุณที่ใช้บริการ', order: 'ออเดอร์ · ได้รับแล้ว', tone: 'background: #ECEFEA; color: #3A433E', on: false, pick: { mark: 'กาแฟ', bg: '#C98A5A', fg: '#2B1607' } }
    ];
    return {
      open: this.state.open,
      openAttr: this.state.open ? 'true' : 'false',
      rot: this.state.open ? 180 : 0,
      toggle: () => this.setState({ open: !this.state.open }),
      rows: items.map((s) => ({
        title: s.title,
        time: s.time,
        snippet: s.snippet,
        hasThumb: !!s.pick,
        thumbMark: s.pick ? s.pick.mark : '',
        thumbStyle: s.pick ? 'width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; background: ' + s.pick.bg + '; color: ' + s.pick.fg : '',
        hasOrder: !!s.order,
        orderLabel: s.order,
        chipStyle: 'align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; padding: 1px 9px; border-radius: 999px; ' + s.tone,
        style: 'box-sizing: border-box; min-height: 44px; display: flex; flex-direction: row; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 12px; ' + (s.on ? 'border: 1px solid #BFE0CF; background: #EAF5EF' : 'border: 1px solid transparent')
      }))
    };
  }
}
</script>
</body>
</html>
